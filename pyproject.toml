[project]
name = "crypto-volatility-hedging-system"
version = "0.1.0"
description = "Offline-runnable BTC/ETH volatility estimation, regime detection, and explainable HEDGE/WAIT/REVIEW decision system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "All rights reserved" }
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.4,<1",
    "detect-secrets>=1.5,<2",
    "httpx>=0.27,<1", # for fastapi.testclient
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E741"]  # E741: single-letter O/H/L/C names mirror standard OHLC notation

[tool.pytest.ini_options]
testpaths = ["tests"]
